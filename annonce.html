<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script><script>
"use strict";
const db=window.supabase?.createClient('https://scmtxejtcmbtiqppwyge.supabase.co','sb_publishable_cOt9qDmFPGapTgprJfR8cg_qZGORsmR'),$=id=>document.getElementById(id),id=new URLSearchParams(location.search).get('id');let lang='fr',property=null;const tr=(fr,en)=>lang==='fr'?fr:en;
function translate(){$('lang').textContent=lang==='fr'?'EN':'FR';$('back').textContent=tr('← Toutes les annonces','← All listings');$('contact').textContent=tr('Contacter sur WhatsApp','Contact on WhatsApp');$('safety').textContent=tr('Visitez le bien et vérifiez les documents avant tout paiement.','Visit the property and verify documents before paying.');if(property)renderInfo()}
function renderInfo(){const p=property;$('title').textContent=p.title;document.title=p.title+' | Immo237';$('description').textContent=p.description;$('price').textContent=new Intl.NumberFormat('fr-FR').format(p.price_fcfa)+' FCFA';$('location').textContent=[p.city,p.neighborhood].filter(Boolean).join(' · ');const types={house:[ 'Maison','House'],apartment:['Appartement','Apartment'],land:['Terrain','Land']};const deals={sale:['Vente','Sale'],rent:['Location','Rent']};const n=lang==='fr'?0:1;$('specs').textContent=[types[p.property_type]?.[n]||p.property_type,deals[p.deal_type]?.[n]||p.deal_type,p.area_m2+' m²',p.bedrooms!=null?p.bedrooms+' '+tr('chambres','bedrooms'):null].filter(Boolean).join(' · ');const phone=String(p.contact_whatsapp||'').replace(/\D/g,'');if(/^2376\d{8}$/.test(phone)){$('contact').href='https://wa.me/'+phone+'?text='+encodeURIComponent(tr('Bonjour, je suis intéressé par ce bien sur Immo237 : ','Hello, I am interested in this property on Immo237: ')+location.href);$('contact').hidden=false;$('contact').onclick=()=>{db.rpc('track_contact',{p_listing_id:p.id}).then(()=>{}).catch(()=>{})}}else $('contact').hidden=true}

async function load(){if(!db||!id||!/^[0-9a-f-]{36}$/i.test(id)){$('status').textContent=tr('Annonce introuvable.','Listing not found.');return}try{const {data,error}=await db.from('properties').select('id,title,description,city,neighborhood,property_type,deal_type,price_fcfa,area_m2,bedrooms,contact_whatsapp').eq('id',id).eq('status','approved').maybeSingle();if(error)throw error;if(!data){$('status').textContent=tr('Annonce introuvable ou non approuvée.','Listing not found or not approved.');return}property=data;renderInfo();const photos=await db.from('property_photos').select('storage_path,slot').eq('property_id',id).order('slot');const urls=[];if(!photos.error)for(const p of photos.data||[]){if(p.storage_path)urls.push(db.storage.from('immo-photos').getPublicUrl(p.storage_path).data.publicUrl)}pictures(urls);$('status').hidden=true;$('detail').hidden=false}catch(e){console.error(e);$('status').textContent=tr('Impossible de charger cette annonce.','Unable to load this listing.')}}
